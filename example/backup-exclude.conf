# Исключения для backup.sh под набор плагинов из этого примера.
# Копировать рядом с backup.sh. Один шаблон в строке, # и пустые строки игнорируются.
#
# Умолчания зашиты в скрипт и работают всегда: logs, crash-reports, cache,
# *.log.gz, libraries, versions, plugins/dynmap/web/tiles.
#
# Все, что ниже, проверено на живом сервере: это либо кеши, которые скачаются
# заново, либо чужие бэкапы, которые незачем класть в свой бэкап.

# --- Скачивается заново при старте ---
# LuckPerms сам подтягивает свои зависимости в libs при первом запуске.
plugins/LuckPerms/libs
# Кеш ремапнутых плагинов, Paper пересоздает его сам.
plugins/.paper-remapped

# --- Плагины, которые бэкапят сами себя ---
# PlayerWarps держит собственные ежедневные копии базы. Свою базу мы и так
# копируем, а копировать чужие копии смысла нет.
plugins/PlayerWarps/data/backups

# --- Рабочие файлы редактора, живут между сессиями и не нужны ---
plugins/FastAsyncWorldEdit/history
plugins/FastAsyncWorldEdit/sessions
plugins/FastAsyncWorldEdit/clipboard
plugins/WorldEdit/sessions
# schematics НЕ исключаем: это постройки, их делали руками.

# --- Профилировщик ---
# Дампы spark весят прилично и после инцидента не нужны.
plugins/spark/tmp

# --- Мусор от macOS, если заливали файлы с мака ---
.DS_Store
