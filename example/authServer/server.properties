# Только то, что влияет на скрипты и на связку с прокси.
# Остальные ключи Paper создаст сам при первом запуске, трогать их тут незачем.

# Слушаем только локальный интерфейс: снаружи до сервера не достучаться,
# и правило в ufw для него не нужно. Открытый порт при modern forwarding
# означает вход мимо авторизации под любым ником.
server-ip=127.0.0.1

# Порт уникален для каждого сервера и совпадает с записью в velocity.toml.
server-port=25566

# Совпадает с online-mode прокси. Не совпало - невнятные ошибки входа.
online-mode=false
